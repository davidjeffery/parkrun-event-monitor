name: Check for new parkruns

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Europe/London
    - cron: '0 18-23 * * 5'
      timezone: Europe/London
    - cron: '0 0-7 * * 6'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      initialize:
        description: Allow first baseline if no snapshot exists (no historical alerts)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: parkrun-event-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test comparison and failure handling
        run: python -m unittest discover -s tests -v
      - name: Check feed and email new IDs
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: djeffery92@gmail.com
          FORCE_CHECK: '1'
          INITIALIZE: ${{ inputs.initialize }}
        run: |
          args=(--verify-smtp)
          if [ "$INITIALIZE" = "true" ]; then args+=(--initialize); fi
          python monitor.py "${args[@]}"
      - name: Persist successful snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events_snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update successful parkrun snapshot [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
            sleep 5
          done
          echo '::error::Snapshot push failed. Recover the artifact before rerunning to avoid duplicate alerts.'
          exit 1
      - name: Keep recovery copy if persistence fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parkrun-snapshot-recovery-${{ github.run_id }}
          path: data/events_snapshot.json
          if-no-files-found: ignore
          retention-days: 90
